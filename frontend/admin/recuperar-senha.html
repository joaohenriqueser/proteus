<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROTEUS — Recuperação de Senha</title>
  <meta name="description" content="Recuperação de acesso à área administrativa do sistema PROTEUS.">

  <!-- Google Fonts: Plus Jakarta Sans, Inter & IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS Design System -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-100/60 to-blue-50/40 text-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans select-none">

  <!-- Ambient background glow -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-400/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-emerald-400/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full relative z-10 space-y-6">

    <div class="glass-card p-7 sm:p-9 shadow-xl space-y-6">
      
      <!-- Topo -->
      <div class="text-center space-y-2">
        <a href="../index.html" class="inline-block hover:opacity-85 transition-opacity" title="Voltar ao início">
          <img src="../assets/logo-full.svg" alt="PROTEUS Logo" class="h-10 w-auto mx-auto mb-2">
        </a>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 border border-blue-200/60 text-blue-600 font-mono text-[11px] font-bold tracking-wider uppercase">
          <i data-lucide="key-round" class="w-3.5 h-3.5"></i>
          Segurança
        </div>
        <h1 id="pageTitle" class="text-xl font-bold text-slate-900 tracking-tight font-heading">Recuperar Senha</h1>
        <p id="pageSubtitle" class="text-xs text-slate-500">Informe seu e-mail cadastrado para receber o link de redefinição.</p>
      </div>

      <!-- Alerta -->
      <div id="alertBox" class="hidden p-3 rounded-xl text-xs font-mono border flex items-start gap-2">
        <i id="alertIcon" data-lucide="alert-circle" class="w-4 h-4 flex-none mt-0.5"></i>
        <span id="alertMsg"></span>
      </div>

      <!-- Formulário 1: Solicitar Link de Recuperação -->
      <form id="formSolicitar" class="space-y-4">
        <div>
          <label for="inputEmail" class="block font-mono text-xs font-semibold text-slate-700 mb-1.5">
            E-mail Cadastrado:
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </span>
            <input 
              type="email" 
              id="inputEmail" 
              placeholder="seu-email@proteus.com" 
              required
              autocomplete="email"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors"
            >
          </div>
        </div>

        <button 
          type="submit" 
          id="btnSolicitar"
          class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-mono font-bold text-xs tracking-wider uppercase transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 mt-2 cursor-pointer"
        >
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>Enviar Instruções</span>
        </button>
      </form>

      <!-- Formulário 2: Redefinir Nova Senha -->
      <form id="formRedefinir" class="space-y-4 hidden">
        <div>
          <label for="inputNovaSenha" class="block font-mono text-xs font-semibold text-slate-700 mb-1.5">
            Nova Senha (mínimo 6 caracteres):
          </label>
          <input 
            type="password" 
            id="inputNovaSenha" 
            placeholder="••••••••" 
            required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors"
          >
        </div>

        <div>
          <label for="inputConfirmarSenha" class="block font-mono text-xs font-semibold text-slate-700 mb-1.5">
            Confirmar Nova Senha:
          </label>
          <input 
            type="password" 
            id="inputConfirmarSenha" 
            placeholder="••••••••" 
            required
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors"
          >
        </div>

        <button 
          type="submit" 
          id="btnRedefinir"
          class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-mono font-bold text-xs tracking-wider uppercase transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 mt-2 cursor-pointer"
        >
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Salvar Nova Senha</span>
        </button>
      </form>

      <!-- Rodapé -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 font-mono">
        <a href="login.html" class="hover:text-blue-600 flex items-center gap-1 transition-colors">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          Voltar ao Login
        </a>
        <a href="../index.html" class="hover:text-blue-600 transition-colors">
          Portal Público
        </a>
      </div>

    </div>

  </div>

  <script>
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const tokenUrl = urlParams.get('token');

    const formSolicitar = document.getElementById('formSolicitar');
    const formRedefinir = document.getElementById('formRedefinir');
    const pageTitle = document.getElementById('pageTitle');
    const pageSubtitle = document.getElementById('pageSubtitle');
    const alertBox = document.getElementById('alertBox');
    const alertMsg = document.getElementById('alertMsg');
    const alertIcon = document.getElementById('alertIcon');

    function showAlert(msg, isError = true) {
      alertBox.classList.remove('hidden', 'bg-rose-50', 'border-rose-200', 'text-rose-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      if (isError) {
        alertBox.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-700');
        alertIcon.setAttribute('data-lucide', 'alert-circle');
      } else {
        alertBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
        alertIcon.setAttribute('data-lucide', 'check-circle-2');
      }
      alertMsg.innerHTML = msg;
      lucide.createIcons();
    }

    if (tokenUrl) {
      formSolicitar.classList.add('hidden');
      formRedefinir.classList.remove('hidden');
      pageTitle.textContent = 'Criar Nova Senha';
      pageSubtitle.textContent = 'Digite sua nova senha de acesso administrativo.';
    }

    formSolicitar.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('inputEmail').value.trim();

      const btn = document.getElementById('btnSolicitar');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processando...`;
      lucide.createIcons();

      try {
        const res = await fetch('/api/auth/recuperar-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        let extraDev = '';
        if (data.devToken) {
          extraDev = `<br><br><span class="font-bold text-blue-600">Ambiente de Desenvolvimento:</span><br><a href="recuperar-senha.html?token=${data.devToken}" class="underline hover:text-blue-700">Clique aqui para redefinir agora com seu token de teste</a>`;
        }

        showAlert((data.message || 'Instruções enviadas com sucesso!') + extraDev, false);
      } catch (err) {
        showAlert('Erro de conexão ao solicitar recuperação.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> ENVIAR INSTRUÇÕES`;
        lucide.createIcons();
      }
    });

    formRedefinir.addEventListener('submit', async (e) => {
      e.preventDefault();
      const novaSenha = document.getElementById('inputNovaSenha').value;
      const confirmarSenha = document.getElementById('inputConfirmarSenha').value;

      if (novaSenha.length < 6) {
        showAlert('A nova senha deve conter pelo menos 6 caracteres.');
        return;
      }

      if (novaSenha !== confirmarSenha) {
        showAlert('As senhas digitadas não coincidem.');
        return;
      }

      const btn = document.getElementById('btnRedefinir');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Redefinindo...`;
      lucide.createIcons();

      try {
        const res = await fetch('/api/auth/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: tokenUrl, novaSenha })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showAlert(data.message + ' Redirecionando para o login...', false);
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showAlert(data.error || 'Erro ao alterar a senha.');
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> SALVAR NOVA SENHA`;
          lucide.createIcons();
        }
      } catch (err) {
        showAlert('Erro de conexão ao redefinir a senha.');
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> SALVAR NOVA SENHA`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
